# Usage: docker compose -f compose.yml -f compose.override.prod.yaml up -d --build
# The image serves its own immutable /dist build; never bind-mount over /usr/share/nginx/html.
services:
  sveltewar-app:
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.sveltewar-https.redirectscheme.scheme=https"
      - "traefik.http.routers.sveltewar-http.rule=Host(`sveltewar.${DOMAIN}`)"
      - "traefik.http.routers.sveltewar-http.entrypoints=web"
      - "traefik.http.routers.sveltewar-http.middlewares=sveltewar-https"
      - "traefik.http.routers.sveltewar-http.service=sveltewar"
      - "traefik.http.routers.sveltewar-secure.rule=Host(`sveltewar.${DOMAIN}`)"
      - "traefik.http.routers.sveltewar-secure.entrypoints=websecure"
      - "traefik.http.routers.sveltewar-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.sveltewar-secure.service=sveltewar"
      - "traefik.http.services.sveltewar.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    name: ${DOCKER_NETWORK_NAME}
    external: true
